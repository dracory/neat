# CockroachDB integration tests.
#
# Runs as a separate workflow so it does not add to the already-long
# tests.yml runtime. Uses cockroachdb/cockroach:v24.3.0 as a service
# container on port 26257.

name: tests-cockroachdb

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cockroachdb:
    runs-on: ubuntu-latest

    services:
      cockroachdb:
        image: cockroachdb/cockroach:v24.3.0
        ports:
          - "26257:26257"
        env:
          COCKROACH_ARGS: "start-single-node --insecure"
          COCKROACH_DATABASE: test
        options: >-
          --health-cmd="cockroach sql --insecure --host=127.0.0.1:26257 -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      COCKROACHDB_HOST: 127.0.0.1
      COCKROACHDB_PORT: 26257
      COCKROACHDB_DATABASE: test
      COCKROACHDB_USER: root
      COCKROACHDB_PASS: ""
      COCKROACHDB_SSLMODE: disable
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Wait for CockroachDB service
        run: |
          echo "Waiting for CockroachDB to be ready..."
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter "ancestor=cockroachdb/cockroach:v24.3.0") cockroach sql --insecure --host=127.0.0.1:26257 -e "SELECT 1;" > /dev/null 2>&1; then
              echo "CockroachDB is ready!"
              break
            fi
            echo "Attempt $i: CockroachDB not ready, waiting..."
            sleep 5
          done

      - name: Create CockroachDB test database
        run: |
          docker exec $(docker ps -q --filter "ancestor=cockroachdb/cockroach:v24.3.0") cockroach sql --insecure --host=127.0.0.1:26257 -e "CREATE DATABASE IF NOT EXISTS test;"

      - name: Verify CockroachDB connection
        run: |
          docker exec $(docker ps -q --filter "ancestor=cockroachdb/cockroach:v24.3.0") cockroach sql --insecure --host=127.0.0.1:26257 -d test -e "SELECT 1;"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run CockroachDB integration tests
        run: go test -v -tags=integration ./integration_tests/cockroachdb/...
