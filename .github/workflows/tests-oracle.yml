# Oracle integration tests.
#
# Runs as a separate workflow so it does not add to the already-long
# tests.yml runtime. Uses gvenzl/oracle-xe as a service container on
# port 1521.

name: tests-oracle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  oracle:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: oracle
        ports:
          - "1521:1521"
        options: >-
          --health-cmd="echo 'SELECT 1 FROM DUAL;' | sqlplus -L sys/oracle@//localhost:1521/XE as sysdba"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=10

    env:
      ORACLE_HOST: 127.0.0.1
      ORACLE_PORT: 1521
      ORACLE_DATABASE: XE
      ORACLE_USER: system
      ORACLE_PASS: oracle
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Wait for Oracle service
        run: |
          echo "Waiting for Oracle to be ready..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 1521; then
              echo "Oracle is ready!"
              break
            fi
            echo "Attempt $i: Oracle not ready, waiting..."
            sleep 5
          done

      - name: Verify Oracle connection
        run: |
          echo "Oracle service is running on port 1521"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run Oracle integration tests
        run: go test -v -tags=integration ./integration_tests/oracle/...
