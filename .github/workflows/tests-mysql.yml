name: tests-mysql

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Verify MySQL connection
        run: |
          CID=$(docker ps --filter "ancestor=mysql:8.0" --format '{{.ID}}' | head -n1)
          docker exec "$CID" mysql -uroot -proot -e "SELECT VERSION(); SHOW DATABASES;"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run MySQL integration tests
        run: go test -v -tags=integration ./integration_tests/mysql/...
