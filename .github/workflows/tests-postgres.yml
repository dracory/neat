# PostgreSQL integration tests.
#
# Runs as a separate workflow so it does not add to the already-long
# tests.yml runtime. Uses postgres:15 as a service container on port 55432.

name: tests-postgres

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_USER: test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: test
      POSTGRES_USER: test
      POSTGRES_PASS: test
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL service
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if PGPASSWORD=${{ env.POSTGRES_PASS }} psql -h 127.0.0.1 -p ${{ env.POSTGRES_PORT }} -d ${{ env.POSTGRES_DATABASE }} -U ${{ env.POSTGRES_USER }} -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready, waiting..."
            sleep 2
          done

      - name: Verify PostgreSQL connection
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASS }} psql -h ${{ env.POSTGRES_HOST }} -p ${{ env.POSTGRES_PORT }} -d ${{ env.POSTGRES_DATABASE }} -U ${{ env.POSTGRES_USER }} -c "SELECT 1;"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run PostgreSQL integration tests
        run: go test -v -tags=integration ./integration_tests/postgres/...
