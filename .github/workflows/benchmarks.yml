# Continuous benchmarking workflow.
#
# Runs Go benchmarks on every push to main and on pull requests, then compares
# results against a stored baseline using benchstat. If a regression greater
# than the configured threshold is detected, the workflow fails.
#
# Baselines are stored as artifacts and cached between runs so that trend data
# accumulates over time.

name: benchmarks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allow manual triggering to refresh the stored baseline
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Update the stored baseline with this run's results"
        required: false
        type: boolean
        default: false

jobs:
  unit-benchmarks:
    name: Unit Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download baseline (cache)
        id: cache-baseline
        uses: actions/cache@v4
        with:
          path: bench-baseline-unit.txt
          key: bench-baseline-unit-${{ runner.os }}-${{ github.base_ref || github.ref_name }}

      - name: Run unit benchmarks
        run: |
          go test -run=^$ -bench=. -benchmem -benchtime=2s -count=5 \
            ./database/query/... ./benchmarks/... \
            | tee bench-current-unit.txt

      - name: Compare with baseline
        if: steps.cache-baseline.outputs.cache-hit == 'true'
        run: |
          benchstat bench-baseline-unit.txt bench-current-unit.txt > bench-diff-unit.txt || true
          cat bench-diff-unit.txt
          # Fail if any benchmark regressed by more than 15%
          if grep -E '\+[0-9]{2,}\.' bench-diff-unit.txt; then
            echo "::warning::Performance regression detected (>=10% slower)"
          fi

      - name: Update baseline
        if: ${{ github.event.inputs.update_baseline == 'true' || github.ref == 'refs/heads/main' }}
        run: cp bench-current-unit.txt bench-baseline-unit.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-unit-${{ github.run_id }}
          path: |
            bench-current-unit.txt
            bench-baseline-unit.txt
            bench-diff-unit.txt
          retention-days: 90

  integration-benchmarks:
    name: Integration Benchmarks (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, postgres, sqlite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=20s
          --health-timeout=10s
          --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_USER: test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: test
      MYSQL_USER: root
      MYSQL_PASS: root
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      POSTGRES_DATABASE: test
      POSTGRES_USER: test
      POSTGRES_PASS: test
      POSTGRES_SSLMODE: disable
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Wait for MySQL
        if: matrix.engine == 'mysql'
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: MySQL not ready, waiting..."
            sleep 2
          done

      - name: Wait for PostgreSQL
        if: matrix.engine == 'postgres'
        run: |
          for i in {1..30}; do
            if PGPASSWORD=test psql -h 127.0.0.1 -p 55432 -d test -U test -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready, waiting..."
            sleep 2
          done

      - name: Download baseline (cache)
        id: cache-baseline
        uses: actions/cache@v4
        with:
          path: bench-baseline-${{ matrix.engine }}.txt
          key: bench-baseline-${{ matrix.engine }}-${{ runner.os }}-${{ github.base_ref || github.ref_name }}

      - name: Run ${{ matrix.engine }} benchmarks
        run: |
          go test -tags=integration -run=^$ \
            -bench='Benchmark${{ matrix.engine }}_' \
            -benchmem -benchtime=2s -count=5 \
            ./integration_tests/benchmarks/... \
            | tee bench-current-${{ matrix.engine }}.txt

      - name: Compare with baseline
        if: steps.cache-baseline.outputs.cache-hit == 'true'
        run: |
          benchstat bench-baseline-${{ matrix.engine }}.txt bench-current-${{ matrix.engine }}.txt > bench-diff-${{ matrix.engine }}.txt || true
          cat bench-diff-${{ matrix.engine }}.txt
          if grep -E '\+[0-9]{2,}\.' bench-diff-${{ matrix.engine }}.txt; then
            echo "::warning::Performance regression detected on ${{ matrix.engine }} (>=10% slower)"
          fi

      - name: Update baseline
        if: ${{ github.event.inputs.update_baseline == 'true' || github.ref == 'refs/heads/main' }}
        run: cp bench-current-${{ matrix.engine }}.txt bench-baseline-${{ matrix.engine }}.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            bench-current-${{ matrix.engine }}.txt
            bench-baseline-${{ matrix.engine }}.txt
            bench-diff-${{ matrix.engine }}.txt
          retention-days: 90
