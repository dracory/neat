# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
#
# Database integration tests run in their own dedicated workflows to keep
# this job fast:
#   tests-mysql.yml, tests-tidb.yml, tests-cockroachdb.yml,
#   tests-postgres.yml, tests-sqlserver.yml, tests-oracle.yml,
#   tests-aztables.yml

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_ACTIONS: true

    steps:
    - uses: actions/checkout@v6

    - name: Configure git for private modules
      run: |
        git config --global url."https://${{ github.token }}@github.com/".insteadOf "https://github.com/"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Run golangci-lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        $(go env GOPATH)/bin/golangci-lint run --timeout 10m

    - name: Run gosec security scanning
      if: always()
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        $(go env GOPATH)/bin/gosec ./... || true

    - name: Run unit tests
      run: go test -v -coverprofile=coverage_unit.out ./...

    - name: Run integration tests
      # Database-specific integration tests run in their own workflows
      # (tests-mysql.yml, tests-tidb.yml, tests-cockroachdb.yml,
      # tests-postgres.yml, tests-sqlserver.yml, tests-oracle.yml,
      # tests-aztables.yml). Only run the remaining integration packages
      # here (common, models, csvdb, jsondb, xmldb, godb, turso, sqlite,
      # benchmarks, *_embedded).
      run: |
        pkgs=$(find integration_tests -mindepth 1 -maxdepth 1 -type d \
          -not -name aztables -not -name oracle \
          -not -name postgres -not -name sqlserver \
          -not -name mysql -not -name tidb -not -name cockroachdb \
          -printf './%p/...\n' | sort)
        go test -v -tags=integration -coverprofile=coverage_integration.out $pkgs

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
