services:
  mysql:
    image: mysql:8.0
    container_name: neat-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    container_name: neat-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: neat-sqlserver-test
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong@Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-No", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: neat-oracle-test
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/oracle@//localhost:1521/XE as sysdba", "SELECT 1 FROM DUAL;"]
      interval: 10s
      timeout: 5s
      retries: 10

  tidb:
    image: pingcap/tidb:v8.5.0
    container_name: neat-tidb-test
    ports:
      - "4000:4000"
    # The pingcap/tidb image is minimal and does not ship mysqladmin/mysql.
    # TiDB exposes a status/metrics HTTP API on port 10080 that returns 200
    # once the server is ready to accept MySQL connections on port 4000.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:10080/status"]
      interval: 10s
      timeout: 5s
      retries: 15

  cockroachdb:
    image: cockroachdb/cockroach:v24.3.0
    container_name: neat-cockroachdb-test
    command: start-single-node --insecure --listen-addr=localhost:26257 --advertise-addr=localhost:26257
    ports:
      - "26257:26257"
      - "8080:8080"
    environment:
      COCKROACH_DATABASE: test
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health?ready=yes"]
      interval: 5s
      timeout: 5s
      retries: 15

  cockroachdb-init:
    image: cockroachdb/cockroach:v24.3.0
    container_name: neat-cockroachdb-init
    depends_on:
      cockroachdb:
        condition: service_healthy
    command: sql --insecure --host cockroachdb:26257 -e "CREATE DATABASE IF NOT EXISTS test;"
    restart: "no"
